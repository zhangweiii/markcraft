name: Secret scan
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        env:
          VERSION: 8.30.1
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep "  $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full Git history (redacted)
        run: gitleaks git --redact --log-opts="--all" .
